<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Warehouse Inventory</title>
<link rel="manifest" href="./manifest.webmanifest">
<style>
:root{--bg:#f5f7fb;--panel:#fff;--text:#182230;--muted:#667085;--border:#e5e7eb;--primary:#2563eb;--primary2:#1d4ed8;--danger:#dc2626;--success:#059669;--warning:#d97706;--shadow:0 8px 30px rgba(15,23,42,.07);--radius:16px}
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}button,input,select,textarea{font:inherit}button{cursor:pointer}
.app{min-height:100%;display:flex}.sidebar{position:fixed;inset:0 auto 0 0;width:255px;background:#111827;color:#fff;display:flex;flex-direction:column;z-index:20}.brand{padding:22px 20px;border-bottom:1px solid rgba(255,255,255,.08);font-weight:800;font-size:18px}.brand span{color:#60a5fa}.nav{padding:12px;overflow:auto}.nav button{width:100%;background:transparent;border:0;color:#cbd5e1;text-align:left;padding:11px 12px;border-radius:10px;margin:2px 0}.nav button:hover,.nav button.active{background:#1f2937;color:#fff}.nav .section{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#64748b;padding:14px 12px 6px}.userbox{margin-top:auto;padding:14px;border-top:1px solid rgba(255,255,255,.08);font-size:12px;color:#cbd5e1}.main{margin-left:255px;width:calc(100% - 255px);min-height:100vh}.topbar{position:sticky;top:0;background:rgba(245,247,251,.9);backdrop-filter:blur(10px);z-index:10;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:13px 22px}.hamb{display:none}.status{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted)}.dot{width:9px;height:9px;border-radius:50%;background:#ef4444}.dot.online{background:#10b981}.sync-pill{padding:6px 9px;border:1px solid var(--border);background:#fff;border-radius:999px}.content{padding:22px;max-width:1600px;margin:auto}.page-title{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:18px}.page-title h1{margin:0;font-size:24px}.page-title p{margin:5px 0 0;color:var(--muted);font-size:13px}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--border);background:#fff;color:var(--text);padding:9px 13px;border-radius:10px}.btn.primary{background:var(--primary);color:#fff;border-color:var(--primary)}.btn.primary:hover{background:var(--primary2)}.btn.danger{color:#fff;background:var(--danger);border-color:var(--danger)}.btn.small{padding:7px 9px;font-size:12px}.grid{display:grid;gap:14px}.cards{grid-template-columns:repeat(6,minmax(0,1fr))}.card,.panel{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}.card{padding:16px}.card .label{font-size:12px;color:var(--muted)}.card .value{margin-top:8px;font-weight:800;font-size:26px}.card .sub{margin-top:5px;font-size:11px;color:var(--muted)}.panel{padding:16px}.panel h3{margin:0 0 12px;font-size:15px}.two{grid-template-columns:1.5fr 1fr}.table-wrap{overflow:auto;border:1px solid var(--border);border-radius:12px}.table{width:100%;border-collapse:collapse;min-width:750px}.table th,.table td{padding:10px 11px;border-bottom:1px solid var(--border);font-size:12px;text-align:left;white-space:nowrap}.table th{background:#f8fafc;color:#475467;font-weight:700}.table tr:last-child td{border-bottom:0}.toolbar{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:12px}.search{min-width:220px}.input,.select,.textarea{width:100%;border:1px solid var(--border);background:#fff;border-radius:10px;padding:10px 11px;outline:none}.input:focus,.select:focus,.textarea:focus{border-color:#93c5fd;box-shadow:0 0 0 3px rgba(37,99,235,.10)}.filters{display:flex;gap:8px;flex-wrap:wrap}.filters>*{width:auto}.badge{display:inline-flex;align-items:center;padding:4px 8px;border-radius:999px;font-size:11px;font-weight:700;background:#eef2ff;color:#3730a3}.badge.green{background:#ecfdf3;color:#027a48}.badge.red{background:#fef2f2;color:#b42318}.badge.amber{background:#fffaeb;color:#b54708}.muted{color:var(--muted)}.empty{padding:40px;text-align:center;color:var(--muted)}.row-actions{display:flex;gap:6px}.login-screen{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,#eef4ff,#f8fafc)}.login-card{width:min(420px,100%);background:#fff;border:1px solid var(--border);box-shadow:var(--shadow);border-radius:22px;padding:26px}.login-card h1{margin:0 0 8px;font-size:24px}.login-card p{margin:0 0 18px;color:var(--muted);font-size:13px}.field{margin-bottom:12px}.field label{display:block;font-size:12px;color:#475467;margin-bottom:6px}.toast{position:fixed;right:18px;bottom:18px;z-index:100;background:#111827;color:#fff;padding:11px 14px;border-radius:12px;box-shadow:var(--shadow);max-width:360px}.toast.error{background:#b42318}.modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.5);display:grid;place-items:center;padding:20px;z-index:50}.modal{width:min(900px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:18px;padding:18px;box-shadow:0 20px 50px rgba(0,0,0,.25)}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.modal-head h2{margin:0;font-size:18px}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.form-grid .full{grid-column:1/-1}.modal-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.mobile-nav{display:none}.login-help{background:#f8fafc;border:1px solid var(--border);border-radius:12px;padding:10px;font-size:11px;color:var(--muted);margin-top:12px}.kpi-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.chartbar{height:10px;background:#eef2f6;border-radius:999px;overflow:hidden}.chartbar span{display:block;height:100%;background:var(--primary);border-radius:999px}.small{font-size:11px}.right{text-align:right}.hidden{display:none!important}
@media(max-width:1100px){.cards{grid-template-columns:repeat(3,minmax(0,1fr))}.two{grid-template-columns:1fr}}
@media(max-width:820px){.sidebar{transform:translateX(-100%);transition:.2s}.sidebar.open{transform:translateX(0)}.main{margin-left:0;width:100%}.hamb{display:inline-flex}.topbar{padding:10px 14px}.content{padding:15px}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.mobile-nav{display:flex;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--border);z-index:15}.mobile-nav button{flex:1;border:0;background:#fff;padding:8px;font-size:10px;color:#667085}.mobile-nav button.active{color:var(--primary);font-weight:800}.two{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}.modal-bg{padding:8px}.modal{max-height:94vh;border-radius:14px}}
</style>
</head>
<body>
<div id="root"></div>
<div id="toastHost"></div>
<script>
(() => {
'use strict';
const state={token:localStorage.getItem('wi_token')||'',user:JSON.parse(localStorage.getItem('wi_user')||'null'),deviceId:localStorage.getItem('wi_device')||crypto.randomUUID(),page:'dashboard',search:'',online:false,pending:0,lastSync:localStorage.getItem('wi_lastSync')||'1970-01-01T00:00:00.000Z',cache:{},modal:null};
localStorage.setItem('wi_device',state.deviceId);
const DEFAULT_API_BASE='https://vege.mdmsportal.uk';
const apiBase=(localStorage.getItem('wi_api') || DEFAULT_API_BASE).replace(/\/$/,'');
const root=document.getElementById('root');
const toastHost=document.getElementById('toastHost');
function toast(msg,error=false){const e=document.createElement('div');e.className='toast'+(error?' error':'');e.textContent=msg;toastHost.innerHTML='';toastHost.appendChild(e);setTimeout(()=>e.remove(),3800)}
function esc(v){return String(v??'').replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m]))}
async function api(path,opts={}){const url=path.startsWith('http')?path:apiBase+path;const headers={'Accept':'application/json',...(opts.body&&!(opts.body instanceof FormData)?{'Content-Type':'application/json'}:{})};if(state.token)headers.Authorization='Bearer '+state.token;const r=await fetch(url,{...opts,headers});if(!r.ok){let d={};try{d=await r.json()}catch{} throw new Error(d.error||`HTTP ${r.status}`)} return r.headers.get('content-type')?.includes('application/json')?r.json():r.blob()}
function saveUser(){localStorage.setItem('wi_token',state.token);localStorage.setItem('wi_user',JSON.stringify(state.user))}
function logout(){state.token='';state.user=null;localStorage.removeItem('wi_token');localStorage.removeItem('wi_user');render()}
function hasRole(...roles){return roles.some(r=>(state.user?.roles||[]).includes(r))}
function can(roles){return hasRole(...roles)}
function navItem(id,label,section,icon='•'){return `<button data-page="${id}" class="${state.page===id?'active':''}">${icon} &nbsp; ${label}</button>`}
function render(){if(!state.token){renderLogin();return}renderApp()}
function renderLogin(){root.innerHTML=`<div class="login-screen"><div class="login-card"><h1>Warehouse Inventory</h1><p>Business inventory, purchasing, sales and delivery management.</p><div class="field"><label>Username</label><input id="lgUser" class="input" value="admin" autocomplete="username"></div><div class="field"><label>Password</label><input id="lgPass" class="input" type="password" value="admin123!" autocomplete="current-password"></div><button class="btn primary" style="width:100%" id="loginBtn">Sign in</button><div class="login-help">Backend API: ${esc(apiBase)}<br>Device ID: ${esc(state.deviceId.slice(0,16))}…<br>Change the default admin password immediately after first login.</div></div></div>`;document.getElementById('loginBtn').onclick=async()=>{try{const r=await api('/api/auth/login',{method:'POST',body:JSON.stringify({username:document.getElementById('lgUser').value,password:document.getElementById('lgPass').value,deviceId:state.deviceId,deviceName:navigator.userAgent.slice(0,80)})});state.token=r.token;state.user=r.user;saveUser();toast('Welcome '+state.user.fullName);render();syncNow()}catch(e){toast(e.message,true)}}}
function sidebar(){return `<aside class="sidebar" id="sidebar"><div class="brand">Warehouse <span>Inventory</span></div><nav class="nav"><div class="section">Workspace</div>${navItem('dashboard','Dashboard','')} ${navItem('products','Products','')} ${navItem('stock','Stock','')} ${navItem('movements','Stock Movements','')}<div class="section">Operations</div>${navItem('purchasing','Purchase Orders','')}${navItem('receiving','Goods Receiving','')}${navItem('sales','Sales Orders','')}${navItem('delivery','Delivery','')}${navItem('transfers','Transfers','')}${navItem('adjustments','Adjustments','')}${navItem('returns','Returns','')}${navItem('scrap','Scrapping','')}${navItem('counts','Stock Counts','')}<div class="section">Master Data</div>${navItem('warehouses','Warehouses','')}${navItem('vendors','Vendors','')}${navItem('customers','Customers','')}<div class="section">Insights</div>${navItem('reports','Reports','')}${can(['SUPER_ADMIN','ADMIN'])?navItem('settings','Settings',''):''}${can(['SUPER_ADMIN','ADMIN'])?navItem('users','Users',''):''}${can(['SUPER_ADMIN','ADMIN'])?navItem('logs','Audit / Errors',''):''}</nav><div class="userbox"><b>${esc(state.user?.fullName||'')}</b><br>${esc((state.user?.roles||[]).join(', '))}<br><button class="btn small" style="margin-top:8px" id="logoutBtn">Sign out</button></div></aside>`}
function topbar(){return `<header class="topbar"><div style="display:flex;align-items:center;gap:10px"><button class="btn small hamb" id="hamb">☰</button><div class="status"><span class="dot ${state.online?'online':''}"></span>${state.online?'Online':'Offline'}</div><div class="sync-pill">Sync: ${state.pending} pending</div></div><div class="status">Last sync: ${state.lastSync==='1970-01-01T00:00:00.000Z'?'Never':new Date(state.lastSync).toLocaleString()}</div></header>`}
function bottomNav(){return `<div class="mobile-nav">${['dashboard','products','stock','reports'].map((x,i)=>`<button data-page="${x}" class="${state.page===x?'active':''}">${['⌂','▦','◒','▤'][i]}<br>${x}</button>`).join('')}</div>`}
async function renderApp(){root.innerHTML=`${sidebar()}<main class="main">${topbar()}<div class="content" id="view"></div></main>${bottomNav()}`;document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{state.page=b.dataset.page;document.getElementById('sidebar')?.classList.remove('open');renderApp()});document.getElementById('logoutBtn').onclick=logout;document.getElementById('hamb')?.addEventListener('click',()=>document.getElementById('sidebar').classList.toggle('open'));await loadPage()}
function pageHeader(title,desc,actions=''){return `<div class="page-title"><div><h1>${esc(title)}</h1><p>${esc(desc)}</p></div><div class="actions">${actions}</div></div>`}
async function loadPage(){const v=document.getElementById('view');try{
 if(state.page==='dashboard')return dashboard(v);if(state.page==='products')return products(v);if(state.page==='stock')return stock(v);if(state.page==='movements')return movements(v);if(state.page==='purchasing')return listPage(v,'Purchase Orders','purchasing');if(state.page==='receiving')return listPage(v,'Goods Receiving','receiving');if(state.page==='sales')return listPage(v,'Sales Orders','sales');if(state.page==='delivery')return listPage(v,'Delivery','delivery');if(state.page==='transfers')return listPage(v,'Transfers','transfers');if(state.page==='adjustments')return listPage(v,'Adjustments','adjustments');if(state.page==='returns')return listPage(v,'Returns','returns');if(state.page==='scrap')return listPage(v,'Scrapping','scrap');if(state.page==='counts')return listPage(v,'Stock Counts','counts');if(state.page==='warehouses')return genericMaster(v,'Warehouses','/api/warehouses','warehouse');if(state.page==='vendors')return genericMaster(v,'Vendors','/api/vendors','vendor');if(state.page==='customers')return genericMaster(v,'Customers','/api/customers','customer');if(state.page==='reports')return reports(v);if(state.page==='settings')return settings(v);if(state.page==='users')return users(v);if(state.page==='logs')return logs(v);
 }catch(e){v.innerHTML=`<div class="panel"><b>Unable to load.</b><p class="muted">${esc(e.message)}</p></div>`}}
async function dashboard(v){const d=await api('/api/dashboard');v.innerHTML=pageHeader('Dashboard','Real-time warehouse overview',`<button class="btn" id="syncBtn">↻ Sync now</button>`)+`<div class="grid cards">${[['Products',d.cards.products,''],['Warehouses',d.cards.warehouses,''],['Stock Units',Number(d.cards.totalStock).toLocaleString(),''],['Low Stock',d.cards.lowStock,'amber'],['Out of Stock',d.cards.outOfStock,'red'],['Pending Deliveries',d.cards.pendingDeliveries,'']].map(x=>`<div class="card"><div class="label">${x[0]}</div><div class="value">${x[1]}</div><div class="sub">${x[2]==='red'?'Needs action':x[2]==='amber'?'Reorder threshold':'Current system view'}</div></div>`).join('')}</div><div class="grid two" style="margin-top:14px"><div class="panel"><h3>Recent stock movement</h3><div class="table-wrap"><table class="table"><thead><tr><th>Date</th><th>Product</th><th>Type</th><th>Qty In</th><th>Qty Out</th><th>Warehouse</th></tr></thead><tbody>${d.recent.map(r=>`<tr><td>${new Date(r.movement_date).toLocaleString()}</td><td>${esc(r.product_name)}</td><td><span class="badge">${esc(r.movement_type)}</span></td><td>${r.quantity_in||0}</td><td>${r.quantity_out||0}</td><td>${esc(r.warehouse_name)}</td></tr>`).join('')}</tbody></table></div></div><div class="panel"><h3>Sync health</h3><div class="kpi-row"><div><div class="small muted">Connection</div><b>${state.online?'Online':'Offline'}</b></div><div><div class="small muted">Pending</div><b>${state.pending}</b></div></div><div style="margin-top:18px"><div class="small muted">Offline-first queue</div><div class="chartbar" style="margin-top:7px"><span style="width:${Math.min(100,state.pending*12)}%"></span></div><div class="small muted" style="margin-top:6px">Transactions are stored locally until the server is reachable.</div></div></div></div>`;document.getElementById('syncBtn').onclick=syncNow}
async function products(v){const data=await api('/api/products?page=1&pageSize=100&search='+encodeURIComponent(state.search));v.innerHTML=pageHeader('Products','Catalog, pricing, reorder levels and images',`<button class="btn primary" id="newProduct">+ New Product</button>`)+`<div class="panel"><div class="toolbar"><div class="filters"><input class="input search" id="search" placeholder="Search SKU, name or barcode" value="${esc(state.search)}"><button class="btn" id="searchBtn">Search</button></div><button class="btn" id="pdfStock">Print Stock PDF</button></div><div class="table-wrap"><table class="table"><thead><tr><th>SKU</th><th>Product</th><th>Category</th><th>Unit</th><th>Price</th><th>Stock</th><th>Reorder</th><th>Status</th></tr></thead><tbody>${data.rows.map(p=>`<tr><td>${esc(p.sku)}</td><td>${esc(p.name)}</td><td>${esc(p.category_name||'')}</td><td>${esc(p.unit_code||'')}</td><td>₱${Number(p.selling_price||0).toLocaleString()}</td><td>${Number(p.stock_qty||0).toLocaleString()}</td><td>${Number(p.reorder_level||0).toLocaleString()}</td><td>${Number(p.stock_qty||0)<=Number(p.reorder_level||0)?'<span class="badge amber">LOW</span>':'<span class="badge green">OK</span>'}</td></tr>`).join('')}</tbody></table></div></div>`;document.getElementById('searchBtn').onclick=()=>{state.search=document.getElementById('search').value;loadPage()};document.getElementById('newProduct').onclick=()=>showProductModal();document.getElementById('pdfStock').onclick=()=>download('/api/pdf/stock','inventory-stock-report.pdf')}
async function stock(v){const rows=await api('/api/stock?search='+encodeURIComponent(state.search));v.innerHTML=pageHeader('Stock','Current on-hand inventory by warehouse, location and batch',`<button class="btn" id="adjustBtn">+ Adjustment</button>`)+`<div class="panel"><div class="toolbar"><input class="input search" id="search" placeholder="Search product or batch" value="${esc(state.search)}"><button class="btn" id="searchBtn">Search</button></div><div class="table-wrap"><table class="table"><thead><tr><th>SKU</th><th>Product</th><th>Warehouse</th><th>Location</th><th>Batch</th><th>Expiry</th><th>Qty</th><th>Avg Cost</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.sku)}</td><td>${esc(r.product_name)}</td><td>${esc(r.warehouse_name)}</td><td>${esc(r.location_code||'')}</td><td>${esc(r.batch_no||'')}</td><td>${esc(r.expiry_date||'')}</td><td><b>${Number(r.quantity||0).toLocaleString()}</b></td><td>₱${Number(r.avg_cost||0).toFixed(2)}</td></tr>`).join('')||'<tr><td colspan="8" class="empty">No stock yet.</td></tr>'}</tbody></table></div></div>`;document.getElementById('searchBtn').onclick=()=>{state.search=document.getElementById('search').value;loadPage()};document.getElementById('adjustBtn').onclick=()=>showTransactionModal('adjustment')}
async function movements(v){const rows=await api('/api/stock-movements?search='+encodeURIComponent(state.search));v.innerHTML=pageHeader('Stock Movements','Immutable inventory ledger of every stock change',`<button class="btn" id="clearSearch">Clear</button>`)+`<div class="panel"><div class="toolbar"><input class="input search" id="search" placeholder="Search movement, product or transaction" value="${esc(state.search)}"><button class="btn" id="searchBtn">Search</button></div><div class="table-wrap"><table class="table"><thead><tr><th>Date</th><th>Transaction</th><th>Product</th><th>Type</th><th>In</th><th>Out</th><th>Balance</th><th>User</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${new Date(r.movement_date).toLocaleString()}</td><td>${esc(r.transaction_id.slice(0,14))}…</td><td>${esc(r.product_name)}</td><td><span class="badge">${esc(r.movement_type)}</span></td><td>${r.quantity_in||0}</td><td>${r.quantity_out||0}</td><td>${r.balance_after}</td><td>${esc(r.username||'')}</td></tr>`).join('')}</tbody></table></div></div>`;document.getElementById('searchBtn').onclick=()=>{state.search=document.getElementById('search').value;loadPage()};document.getElementById('clearSearch').onclick=()=>{state.search='';loadPage()}}
const listMap={purchasing:{endpoint:'/api/purchase-orders',new:'purchase'},receiving:{endpoint:'/api/goods-receipts',new:'goods'},sales:{endpoint:'/api/sales-orders',new:'sales'},delivery:{endpoint:'/api/deliveries',new:'delivery'},transfers:{endpoint:'/api/transfers',new:'transfer'},adjustments:{endpoint:'/api/adjustments',new:'adjustment'},returns:{endpoint:'/api/returns',new:'return'},scrap:{endpoint:'/api/scraps',new:'scrap'},counts:{endpoint:'/api/stock-counts',new:'count'}};
async function listPage(v,title,key){const m=listMap[key];const rows=await api(m.endpoint);v.innerHTML=pageHeader(title,'Transaction workflow and document history',`<button class="btn primary" id="newTxn">+ New</button>`)+`<div class="panel"><div class="table-wrap"><table class="table"><thead><tr>${Object.keys(rows[0]||{number:'',status:'',created_at:''}).map(k=>`<th>${esc(k.replaceAll('_',' '))}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${Object.entries(r).map(([k,val])=>`<td>${k==='status'?statusBadge(val):esc(val??'')}</td>`).join('')}</tr>`).join('')||'<tr><td class="empty">No records yet.</td></tr>'}</tbody></table></div></div>`;document.getElementById('newTxn').onclick=()=>showTransactionModal(m.new)}
function statusBadge(v){const s=String(v||'');const cls=/RECEIVED|DELIVERED|COMPLETED|POSTED|APPROVED/.test(s)?'green':/FAILED|CANCEL/.test(s)?'red':'amber';return `<span class="badge ${cls}">${esc(s)}</span>`}
async function genericMaster(v,title,endpoint,type){const rows=await api(endpoint);v.innerHTML=pageHeader(title,'Master data used throughout transactions',`<button class="btn primary" id="newMaster">+ New</button>`)+`<div class="panel"><div class="toolbar"><input class="input search" id="search" placeholder="Search" value=""><button class="btn" id="reload">Reload</button></div><div class="table-wrap"><table class="table"><thead><tr>${Object.keys(rows[0]||{}).slice(0,9).map(k=>`<th>${esc(k.replaceAll('_',' '))}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${Object.entries(r).slice(0,9).map(([k,val])=>`<td>${esc(val??'')}</td>`).join('')}</tr>`).join('')||'<tr><td class="empty">No records.</td></tr>'}</tbody></table></div></div>`;document.getElementById('reload').onclick=loadPage;document.getElementById('newMaster').onclick=()=>showMasterModal(type)}
async function reports(v){v.innerHTML=pageHeader('Reports','Inventory, transaction and movement analytics',`<button class="btn" id="stockPdf">Inventory PDF</button>`)+`<div class="grid two"><div class="panel"><h3>Low Stock</h3><div id="low"></div></div><div class="panel"><h3>Expiring within 30 days</h3><div id="exp"></div></div></div><div class="panel" style="margin-top:14px"><h3>Transaction report</h3><div class="table-wrap" id="trx"></div></div>`;const [low,exp,trx]=await Promise.all([api('/api/reports/low-stock'),api('/api/reports/expiring?days=30'),api('/api/reports/transactions')]);document.getElementById('low').innerHTML=`<div class="table-wrap"><table class="table"><tr><th>SKU</th><th>Product</th><th>Stock</th><th>Reorder</th></tr>${low.slice(0,50).map(x=>`<tr><td>${esc(x.sku)}</td><td>${esc(x.name)}</td><td>${x.stock_qty}</td><td>${x.reorder_level}</td></tr>`).join('')||'<tr><td class="empty" colspan="4">No low-stock products.</td></tr>'}</table></div>`;document.getElementById('exp').innerHTML=`<div class="table-wrap"><table class="table"><tr><th>Product</th><th>Warehouse</th><th>Expiry</th><th>Qty</th></tr>${exp.slice(0,50).map(x=>`<tr><td>${esc(x.product_name)}</td><td>${esc(x.warehouse_name)}</td><td>${esc(x.expiry_date)}</td><td>${x.quantity}</td></tr>`).join('')||'<tr><td class="empty" colspan="4">No expiring stock.</td></tr>'}</table></div>`;document.getElementById('trx').innerHTML=`<table class="table"><tr><th>Date</th><th>Type</th><th>Number</th><th>Status</th><th>Total</th></tr>${trx.map(x=>`<tr><td>${new Date(x.created_at).toLocaleString()}</td><td>${esc(x.type)}</td><td>${esc(x.number)}</td><td>${statusBadge(x.status)}</td><td>${Number(x.total||0)?'₱'+Number(x.total).toLocaleString():'—'}</td></tr>`).join('')}</table>`;document.getElementById('stockPdf').onclick=()=>download('/api/pdf/stock','inventory-stock-report.pdf')}
async function settings(v){const s=await api('/api/settings');v.innerHTML=pageHeader('Settings','Company, tax and number-sequence configuration')+`<div class="grid two"><div class="panel"><h3>Company</h3><div class="form-grid"><div class="field full"><label>Company name</label><input id="coName" class="input" value="${esc(s.company.company_name)}"></div><div class="field full"><label>Address</label><input id="coAddr" class="input" value="${esc(s.company.address||'')}"></div><div class="field"><label>Phone</label><input id="coPhone" class="input" value="${esc(s.company.phone||'')}"></div><div class="field"><label>Email</label><input id="coEmail" class="input" value="${esc(s.company.email||'')}"></div></div><button class="btn primary" id="saveCo">Save company</button></div><div class="panel"><h3>SMSGate</h3><div id="smsStatus" class="muted">Loading…</div><div class="field" style="margin-top:12px"><label>Test number</label><input id="smsPhone" class="input" placeholder="09xxxxxxxxx"></div><button class="btn" id="testSms">Send test SMS</button></div></div><div class="panel" style="margin-top:14px"><h3>Number sequences</h3><div class="table-wrap"><table class="table"><tr><th>Code</th><th>Prefix</th><th>Next</th><th>Padding</th><th></th></tr>${s.sequences.map(x=>`<tr><td>${esc(x.code)}</td><td><input class="input seqp" data-code="${esc(x.code)}" value="${esc(x.prefix)}"></td><td><input class="input seqn" data-code="${esc(x.code)}" value="${x.next_number}"></td><td><input class="input seqpad" data-code="${esc(x.code)}" value="${x.padding}"></td><td><button class="btn small seqSave" data-code="${esc(x.code)}">Save</button></td></tr>`).join('')}</table></div></div>`;document.getElementById('saveCo').onclick=async()=>{await api('/api/settings/company',{method:'PUT',body:JSON.stringify({companyName:document.getElementById('coName').value,address:document.getElementById('coAddr').value,phone:document.getElementById('coPhone').value,email:document.getElementById('coEmail').value})});toast('Company settings saved')};const sms=await api('/api/sms/status');document.getElementById('smsStatus').innerHTML=`Provider: <b>${sms.provider}</b><br>Enabled: <b>${sms.enabled?'Yes':'No'}</b><br>Queued: ${sms.queue?.pending||0} · Sent: ${sms.queue?.sent||0} · Failed: ${sms.queue?.failed||0}`;document.getElementById('testSms').onclick=async()=>{try{await api('/api/sms/test',{method:'POST',body:JSON.stringify({phone:document.getElementById('smsPhone').value,message:'Warehouse Inventory SMS test successful.'})});toast('Test SMS queued');}catch(e){toast(e.message,true)}};document.querySelectorAll('.seqSave').forEach(b=>b.onclick=async()=>{const code=b.dataset.code;await api('/api/settings/sequence/'+code,{method:'PUT',body:JSON.stringify({prefix:document.querySelector(`.seqp[data-code="${code}"]`).value,nextNumber:document.querySelector(`.seqn[data-code="${code}"]`).value,padding:document.querySelector(`.seqpad[data-code="${code}"]`).value})});toast('Sequence saved')})}
async function users(v){const rows=await api('/api/users');v.innerHTML=pageHeader('Users','Users and roles',`<button class="btn primary" id="newUser">+ New User</button>`)+`<div class="panel"><div class="table-wrap"><table class="table"><tr><th>Username</th><th>Name</th><th>Email</th><th>Phone</th><th>Roles</th><th>Status</th></tr>${rows.map(r=>`<tr><td>${esc(r.username)}</td><td>${esc(r.full_name)}</td><td>${esc(r.email)}</td><td>${esc(r.phone)}</td><td>${esc(r.roles||'')}</td><td>${r.active?'<span class="badge green">Active</span>':'<span class="badge red">Disabled</span>'}</td></tr>`).join('')}</table></div></div>`;document.getElementById('newUser').onclick=()=>showUserModal()}
async function logs(v){const [a,e]=await Promise.all([api('/api/audit-logs'),api('/api/error-logs')]);v.innerHTML=pageHeader('Audit & Error Logs','Basic traceability for users and system errors')+`<div class="grid two"><div class="panel"><h3>Audit</h3><div class="table-wrap"><table class="table"><tr><th>Date</th><th>User</th><th>Action</th><th>Module</th><th>Entity</th></tr>${a.slice(0,150).map(x=>`<tr><td>${new Date(x.created_at).toLocaleString()}</td><td>${esc(x.username||'')}</td><td>${esc(x.action)}</td><td>${esc(x.module)}</td><td>${esc(x.entity_type)} ${x.entity_id||''}</td></tr>`).join('')}</table></div></div><div class="panel"><h3>Errors</h3><div class="table-wrap"><table class="table"><tr><th>Date</th><th>Level</th><th>Message</th></tr>${e.slice(0,150).map(x=>`<tr><td>${new Date(x.created_at).toLocaleString()}</td><td>${esc(x.level)}</td><td>${esc(x.message)}</td></tr>`).join('')}</table></div></div></div>`}
function closeModal(){state.modal?.remove();state.modal=null}
function openModal(title,body,onSubmit){const bg=document.createElement('div');bg.className='modal-bg';bg.innerHTML=`<div class="modal"><div class="modal-head"><h2>${esc(title)}</h2><button class="btn small" id="mClose">✕</button></div>${body}<div class="modal-foot"><button class="btn" id="mCancel">Cancel</button><button class="btn primary" id="mSave">Save</button></div></div>`;document.body.appendChild(bg);state.modal=bg;bg.querySelector('#mClose').onclick=closeModal;bg.querySelector('#mCancel').onclick=closeModal;bg.querySelector('#mSave').onclick=async()=>{try{await onSubmit(bg);closeModal();toast('Saved');await loadPage()}catch(e){toast(e.message,true)}}}
async function lookups(){try{const [cats,units,wh,vendors,customers,products]=await Promise.all([api('/api/categories'),api('/api/units'),api('/api/warehouses'),api('/api/vendors?limit=500'),api('/api/customers?limit=500'),api('/api/products?page=1&pageSize=500')]);const out={cats,units,wh,vendors,customers,products:products.rows};localStorage.setItem('wi_lookups',JSON.stringify(out));return out}catch(e){const cached=localStorage.getItem('wi_lookups');if(cached)return JSON.parse(cached);throw e}}
async function showProductModal(){const l=await lookups();openModal('New Product',`<div class="form-grid"><div class="field"><label>SKU</label><input name="sku" class="input" required></div><div class="field"><label>Barcode</label><input name="barcode" class="input"></div><div class="field full"><label>Name</label><input name="name" class="input" required></div><div class="field"><label>Category</label><select name="categoryId" class="select">${l.cats.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select></div><div class="field"><label>Unit</label><select name="unitId" class="select">${l.units.map(x=>`<option value="${x.id}">${esc(x.code)} - ${esc(x.name)}</option>`).join('')}</select></div><div class="field"><label>Purchase price</label><input name="purchasePrice" class="input" type="number" step="0.01" value="0"></div><div class="field"><label>Selling price</label><input name="sellingPrice" class="input" type="number" step="0.01" value="0"></div><div class="field"><label>Reorder level</label><input name="reorderLevel" class="input" type="number" step="0.01" value="0"></div><div class="field"><label>Perishable</label><select name="perishable" class="select"><option value="0">No</option><option value="1">Yes</option></select></div><div class="field full"><label>Description</label><textarea name="description" class="textarea"></textarea></div></div>`,async bg=>{const f=n=>bg.querySelector(`[name="${n}"]`).value;await submitTx('PRODUCT_CREATE',{sku:f('sku'),barcode:f('barcode'),name:f('name'),categoryId:f('categoryId'),unitId:f('unitId'),purchasePrice:f('purchasePrice'),sellingPrice:f('sellingPrice'),reorderLevel:f('reorderLevel'),perishable:f('perishable')==='1',description:f('description')},'/api/products')})}
async function showMasterModal(type){const map={warehouse:{title:'New Warehouse',endpoint:'/api/warehouses',fields:[['code','Code'],['name','Name'],['address','Address'],['manager_name','Manager'],['phone','Phone']]},vendor:{title:'New Vendor',endpoint:'/api/vendors',fields:[['code','Code'],['company_name','Company name'],['contact_person','Contact'],['phone','Phone'],['email','Email'],['address','Address']]},customer:{title:'New Customer',endpoint:'/api/customers',fields:[['code','Code'],['name','Name'],['contact_person','Contact'],['phone','Phone'],['email','Email'],['address','Address']]}}[type];openModal(map.title,`<div class="form-grid">${map.fields.map(([n,l])=>`<div class="field"><label>${l}</label><input class="input" name="${n}"></div>`).join('')}</div>`,async bg=>{const payload={};map.fields.forEach(([n])=>payload[n]=bg.querySelector(`[name="${n}"]`).value);payload.active=true;await api(map.endpoint,{method:'POST',body:JSON.stringify(payload)})})}
async function showUserModal(){openModal('New User',`<div class="form-grid"><div class="field"><label>Username</label><input name="username" class="input"></div><div class="field"><label>Full name</label><input name="fullName" class="input"></div><div class="field"><label>Password</label><input name="password" class="input" type="password" value="ChangeMe123!"></div><div class="field"><label>Email</label><input name="email" class="input"></div><div class="field"><label>Phone</label><input name="phone" class="input"></div><div class="field"><label>Role</label><select name="role" class="select">${['ADMIN','WAREHOUSE_MANAGER','WAREHOUSE_STAFF','PURCHASING','SALES','VIEWER'].map(x=>`<option>${x}</option>`).join('')}</select></div></div>`,async bg=>{const g=n=>bg.querySelector(`[name="${n}"]`).value;await api('/api/users',{method:'POST',body:JSON.stringify({username:g('username'),fullName:g('fullName'),password:g('password'),email:g('email'),phone:g('phone'),role:g('role')})})})}
async function showTransactionModal(type){const l=await lookups();const defs={purchase:{title:'New Purchase Order',endpoint:'/api/purchase-orders',body:`<div class="form-grid"><div class="field"><label>Vendor</label><select name="vendorId" class="select">${l.vendors.map(x=>`<option value="${x.id}">${esc(x.company_name)}</option>`).join('')}</select></div><div class="field"><label>Warehouse</label><select name="warehouseId" class="select">${l.wh.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select></div><div class="field"><label>Product</label><select name="productId" class="select">${l.products.map(x=>`<option value="${x.id}">${esc(x.sku)} - ${esc(x.name)}</option>`).join('')}</select></div><div class="field"><label>Quantity</label><input name="qty" class="input" type="number" step="0.01" value="1"></div><div class="field"><label>Unit price</label><input name="unitPrice" class="input" type="number" step="0.01" value="0"></div></div>`,submit:async bg=>{const g=n=>bg.querySelector(`[name="${n}"]`).value;return submitTx('PURCHASE_ORDER',{vendorId:g('vendorId'),warehouseId:g('warehouseId'),items:[{productId:g('productId'),qty:g('qty'),unitPrice:g('unitPrice'),taxRate:0}]},'/api/purchase-orders')}},sales:{title:'New Sales Order',endpoint:'/api/sales-orders',body:`<div class="form-grid"><div class="field"><label>Customer</label><select name="customerId" class="select">${l.customers.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select></div><div class="field"><label>Warehouse</label><select name="warehouseId" class="select">${l.wh.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select></div><div class="field"><label>Product</label><select name="productId" class="select">${l.products.map(x=>`<option value="${x.id}">${esc(x.sku)} - ${esc(x.name)}</option>`).join('')}</select></div><div class="field"><label>Quantity</label><input name="qty" class="input" type="number" step="0.01" value="1"></div><div class="field"><label>Unit price</label><input name="unitPrice" class="input" type="number" step="0.01" value="0"></div></div>`,submit:async bg=>{const g=n=>bg.querySelector(`[name="${n}"]`).value;return submitTx('SALES_ORDER',{customerId:g('customerId'),warehouseId:g('warehouseId'),items:[{productId:g('productId'),qty:g('qty'),unitPrice:g('unitPrice'),taxRate:0}]},'/api/sales-orders')}},goods:{title:'Goods Receipt',endpoint:'/api/goods-receipts',body:`<div class="form-grid"><div class="field"><label>Warehouse</label><select name="warehouseId" class="select">${l.wh.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select></div><div class="field"><label>Product</label><select name="productId" class="select">${l.products.map(x=>`<option value="${x.id}">${esc(x.sku)} - ${esc(x.name)}</option>`).join('')}</select></div><div class="field"><label>Accepted qty</label><input name="acceptedQty" class="input" type="number" step="0.01" value="1"></div><div class="field"><label>Rejected qty</label><input name="rejectedQty" class="input" type="number" step="0.01" value="0"></div><div class="field"><label>Unit cost</label><input name="unitCost" class="input" type="number" step="0.01" value="0"></div><div class="field"><label>Batch/Lot</label><input name="batchNo" class="input"></div><div class="field"><label>Expiry date</label><input name="expiryDate" class="input" type="date"></div></div>`,submit:async bg=>{const g=n=>bg.querySelector(`[name="${n}"]`).value;return submitTx('GOODS_RECEIPT',{warehouseId:g('warehouseId'),items:[{productId:g('productId'),acceptedQty:g('acceptedQty'),rejectedQty:g('rejectedQty'),unitCost:g('unitCost'),batchNo:g('batchNo'),expiryDate:g('expiryDate')}]},'/api/goods-receipts')}},delivery:{title:'New Delivery',endpoint:'/api/deliveries',body:`<div class="form-grid"><div class="field"><label>Customer</label><select name="customerId" class="select">${l.customers.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select></div><div class="field"><label>Warehouse</label><select name="warehouseId" class="select">${l.wh.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select></div><div class="field"><label>Product</label><select name="productId" class="select">${l.products.map(x=>`<option value="${x.id}">${esc(x.sku)} - ${esc(x.name)}</option>`).join('')}</select></div><div class="field"><label>Qty</label><input name="qty" class="input" type="number" step="0.01" value="1"></div><div class="field"><label>Delivered to</label><input name="deliveredTo" class="input"></div></div>`,submit:async bg=>{const g=n=>bg.querySelector(`[name="${n}"]`).value;return submitTx('DELIVERY',{customerId:g('customerId'),warehouseId:g('warehouseId'),deliveredTo:g('deliveredTo'),items:[{productId:g('productId'),qty:g('qty'),unitPrice:0}]},'/api/deliveries')}},transfer:{title:'Warehouse Transfer',endpoint:'/api/transfers',body:`<div class="form-grid"><div class="field"><label>From</label><select name="fromWarehouseId" class="select">${l.wh.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select></div><div class="field"><label>To</label><select name="toWarehouseId" class="select">${l.wh.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select></div><div class="field"><label>Product</label><select name="productId" class="select">${l.products.map(x=>`<option value="${x.id}">${esc(x.sku)} - ${esc(x.name)}</option>`).join('')}</select></div><div class="field"><label>Qty</label><input name="qty" class="input" type="number" step="0.01" value="1"></div></div>`,submit:async bg=>{const g=n=>bg.querySelector(`[name="${n}"]`).value;return submitTx('TRANSFER',{fromWarehouseId:g('fromWarehouseId'),toWarehouseId:g('toWarehouseId'),items:[{productId:g('productId'),qty:g('qty')}]},'/api/transfers')}},adjustment:{title:'Stock Adjustment',endpoint:'/api/adjustments',body:`<div class="form-grid"><div class="field"><label>Warehouse</label><select name="warehouseId" class="select">${l.wh.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select></div><div class="field"><label>Product</label><select name="productId" class="select">${l.products.map(x=>`<option value="${x.id}">${esc(x.sku)} - ${esc(x.name)}</option>`).join('')}</select></div><div class="field"><label>Quantity delta (+/-)</label><input name="qtyDelta" class="input" type="number" step="0.01" value="0"></div><div class="field"><label>Reason</label><input name="reason" class="input" value="Correction"></div></div>`,submit:async bg=>{const g=n=>bg.querySelector(`[name="${n}"]`).value;const payload={warehouseId:g('warehouseId'),reason:g('reason'),items:[{productId:g('productId'),qtyDelta:g('qtyDelta')}]};return submitTx('STOCK_ADJUST',payload,'/api/adjustments')}}};const d=defs[type]||defs.adjustment;openModal(d.title,d.body,async bg=>d.submit(bg))}
async function submitTx(operation,payload,endpoint){if(!navigator.onLine||!state.online){await enqueue(operation,payload);return{offline:true}}return api(endpoint,{method:'POST',body:JSON.stringify(payload)})}
async function enqueue(operation,payload){const dbx=await idb();const tx=dbx.transaction('sync','readwrite');tx.objectStore('sync').add({transactionId:crypto.randomUUID(),deviceId:state.deviceId,operation,payload,createdAt:new Date().toISOString(),status:'PENDING'});await txDone(tx);toast('Saved offline; will sync automatically')}
function idb(){return new Promise((resolve,reject)=>{const r=indexedDB.open('warehouse-pwa',1);r.onupgradeneeded=()=>r.result.createObjectStore('sync',{keyPath:'transactionId'});r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
function txDone(tx){return new Promise((resolve,reject)=>{tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error||new Error('IndexedDB transaction failed'));tx.onabort=()=>reject(tx.error||new Error('IndexedDB transaction aborted'))})}
async function getPending(){try{const dbx=await idb();return await new Promise((res,rej)=>{const t=dbx.transaction('sync','readonly');const r=t.objectStore('sync').getAll();r.onsuccess=()=>res(r.result||[]);r.onerror=()=>rej(r.error)})}catch{return[]}}
async function syncNow(){if(!state.token)return;state.online=false;try{await fetch(apiBase+'/health',{cache:'no-store'});state.online=true}catch{updateShell();return}try{const pending=await getPending();state.pending=pending.length;updateShell();if(pending.length){const res=await api('/api/sync/push',{method:'POST',body:JSON.stringify({deviceId:state.deviceId,transactions:pending})});const dbx=await idb();for(const r of res.results||[]){if(r.status==='SYNCED'||r.status==='ALREADY_PROCESSED'){const t=dbx.transaction('sync','readwrite');t.objectStore('sync').delete(r.transactionId);await txDone(t)}}}const pull=await api('/api/sync/pull?since='+encodeURIComponent(state.lastSync));state.lastSync=pull.serverTime;localStorage.setItem('wi_lastSync',state.lastSync);state.pending=(await getPending()).length;toast('Sync complete')}catch(e){toast('Sync failed: '+e.message,true)}finally{state.online=true;updateShell();}}
function updateShell(){const st=document.querySelector('.status');if(st){st.innerHTML=`<span class="dot ${state.online?'online':''}"></span>${state.online?'Online':'Offline'}`}const pill=document.querySelector('.sync-pill');if(pill)pill.textContent=`Sync: ${state.pending} pending`;const lb=document.querySelector('.topbar .status:last-child');if(lb)lb.textContent='Last sync: '+(state.lastSync==='1970-01-01T00:00:00.000Z'?'Never':new Date(state.lastSync).toLocaleString())}
window.addEventListener('online',()=>syncNow());window.addEventListener('offline',()=>{state.online=false;updateShell()});setInterval(async()=>{state.pending=(await getPending()).length;syncNow()},12000);
async function download(path,name){try{const blob=await api(path);const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),5000)}catch(e){toast(e.message,true)}}
if('serviceWorker' in navigator && location.protocol!=='file:')navigator.serviceWorker.register('./sw.js').catch(()=>{});
render();syncNow();
})();
</script>
