<!doctype html>
<html lang="en">
<head>

<meta name="theme-color" content="#0b3d2e">
<meta name="description" content="Premium farm and trading financial management PWA">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon-192.png">
<title>VEGE • Farm & Trading Finance</title>
<style>
:root{--bg:#071a14;--bg2:#0d241c;--surface:#ffffff;--surface2:#f5f7f6;--ink:#0d1b16;--muted:#6d7b75;--line:#dce6e1;--brand:#0d5b43;--brand2:#0a7b59;--accent:#c9f36b;--danger:#b42318;--warn:#b54708;--shadow:0 18px 50px rgba(4,20,14,.12);--radius:20px;--radiusSm:14px}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#eef3f0;color:var(--ink)}body{padding-bottom:84px}.app{min-height:100vh;background:radial-gradient(circle at 15% -5%,rgba(201,243,107,.14),transparent 24%),linear-gradient(180deg,#082218 0 124px,#eef3f0 124px)}
.topbar{position:sticky;top:0;z-index:50;background:rgba(7,26,20,.88);backdrop-filter:blur(18px);color:white;border-bottom:1px solid rgba(255,255,255,.08)}.topbarInner{max-width:1400px;margin:auto;padding:14px 20px;display:flex;align-items:center;gap:14px}.brand{display:flex;align-items:center;gap:12px;min-width:0}.brandMark{width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg,#d6fb76,#82c852);display:grid;place-items:center;color:#0a321f;font-size:22px;font-weight:900;box-shadow:0 10px 25px rgba(201,243,107,.2)}.brandText{min-width:0}.brandText strong{display:block;font-size:15px;letter-spacing:.02em}.brandText span{display:block;color:#b9cac2;font-size:11px;white-space:nowrap}.topbarSpacer{flex:1}.sync{display:inline-flex;align-items:center;gap:7px;border:1px solid rgba(255,255,255,.12);padding:7px 10px;border-radius:999px;font-size:11px;color:#dcebe5}.dot{width:7px;height:7px;border-radius:50%;background:#9acb6a}.dot.bad{background:#ff7d73}.dot.warn{background:#ffbd68}
.layout{max-width:1400px;margin:auto;display:grid;grid-template-columns:240px 1fr;gap:20px;padding:20px}.sidebar{align-self:start;position:sticky;top:82px;background:rgba(255,255,255,.82);backdrop-filter:blur(12px);border:1px solid rgba(218,227,222,.8);border-radius:22px;padding:12px;box-shadow:var(--shadow)}.navItem{width:100%;display:flex;align-items:center;gap:11px;border:0;background:transparent;border-radius:14px;padding:12px;color:#405049;text-align:left;cursor:pointer;font-size:13px;font-weight:700}.navItem:hover{background:#edf5f0}.navItem.active{background:#0c4f3b;color:white;box-shadow:0 12px 25px rgba(12,79,59,.18)}.navIcon{width:18px;height:18px;display:grid;place-items:center;font-size:16px}.sidebarFoot{margin-top:10px;padding:12px;border-top:1px solid var(--line);font-size:11px;color:var(--muted);line-height:1.45}
.main{min-width:0}.page{display:none}.page.active{display:block}.hero{display:flex;justify-content:space-between;gap:16px;align-items:flex-end;margin:5px 0 18px}.eyebrow{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#6c7d75}.hero h1{margin:5px 0 0;font-size:clamp(24px,4vw,34px);line-height:1.05}.hero p{margin:7px 0 0;color:var(--muted);font-size:13px}.heroActions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:0;border-radius:14px;padding:10px 14px;font:inherit;font-weight:800;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px}.btn.primary{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;box-shadow:0 12px 25px rgba(10,91,67,.18)}.btn.secondary{background:#fff;border:1px solid var(--line);color:#294039}.btn.ghost{background:rgba(255,255,255,.7);border:1px solid rgba(16,48,38,.08)}.btn.icon{width:42px;padding:0}.btn.danger{background:#fff1f0;color:var(--danger)}
.grid{display:grid;gap:14px}.kpiGrid{grid-template-columns:repeat(5,minmax(0,1fr));margin-bottom:14px}.cardGrid{grid-template-columns:repeat(3,minmax(0,1fr))}.card{background:rgba(255,255,255,.92);border:1px solid rgba(217,228,222,.95);border-radius:var(--radius);padding:17px;box-shadow:var(--shadow)}.card.clickable{cursor:pointer;transition:.2s transform,.2s box-shadow}.card.clickable:hover{transform:translateY(-2px);box-shadow:0 20px 55px rgba(4,20,14,.14)}.kpiCard{position:relative;overflow:hidden}.kpiCard:after{content:"";position:absolute;width:110px;height:110px;border-radius:50%;background:rgba(13,91,67,.06);right:-30px;top:-30px}.kpiLabel{font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}.kpiValue{font-size:clamp(22px,4vw,29px);font-weight:900;margin-top:7px;letter-spacing:-.03em}.kpiFoot{font-size:11px;color:var(--muted);margin-top:4px}.positive{color:#0c684c}.negative{color:#b42318}.neutral{color:#24312c}
.panelTitle{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:12px}.panelTitle h3{margin:0;font-size:15px}.panelTitle span{font-size:11px;color:var(--muted)}.section{margin-top:14px}.quickGrid{grid-template-columns:repeat(4,minmax(0,1fr))}.quick{padding:16px}.quick strong{display:block;font-size:13px}.quick span{display:block;color:var(--muted);font-size:11px;margin-top:4px}
.formGrid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:11px}.field{display:flex;flex-direction:column;gap:6px;min-width:0}.field label{font-size:11px;font-weight:800;color:#56645f}.field input,.field select,.field textarea{width:100%;border:1px solid #d4dfda;background:#fbfcfb;border-radius:12px;padding:11px 12px;font:inherit;font-size:13px;outline:none}.field input:focus,.field select:focus,.field textarea:focus{border-color:#81bca5;box-shadow:0 0 0 4px rgba(21,123,91,.08)}.span2{grid-column:span 2}.span3{grid-column:span 3}.span4{grid-column:span 4}.span6{grid-column:1/-1}.formActions{display:flex;align-items:end;gap:8px}.notice{padding:12px 14px;border-radius:14px;background:#eff8f3;border:1px solid #d7ebe0;color:#315247;font-size:12px;line-height:1.5}.notice.warn{background:#fff7ed;border-color:#fed7aa;color:#8a4b08}.notice.danger{background:#fff1f0;border-color:#f7c5c0;color:#8f241c}
.dataCard{padding:0;overflow:hidden}.dataHeader{padding:15px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px}.dataTools{display:flex;gap:6px}.list{display:flex;flex-direction:column}.listItem{padding:13px 16px;border-bottom:1px solid #edf1ee;display:flex;align-items:center;gap:12px}.listItem:last-child{border-bottom:0}.avatar{width:40px;height:40px;border-radius:13px;background:#eff5f2;display:grid;place-items:center;font-weight:900;color:#0c5b43;flex:0 0 auto}.liMain{min-width:0;flex:1}.liTitle{font-size:13px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.liMeta{font-size:11px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.liAmount{font-size:13px;font-weight:900;white-space:nowrap}.empty{padding:35px 16px;text-align:center;color:var(--muted);font-size:12px}
.tableWrap{overflow:auto;border-top:1px solid var(--line)}table{width:100%;border-collapse:collapse;min-width:760px}th,td{padding:11px 14px;border-bottom:1px solid #edf1ee;text-align:left;font-size:12px}th{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:#6a7872;background:#f8faf9;position:sticky;top:0}td.num{text-align:right;font-variant-numeric:tabular-nums}.badge{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:5px 8px;font-size:10px;font-weight:800;background:#edf5f0;color:#175e46}.badge.warn{background:#fff4df;color:#9b5d07}.badge.danger{background:#fff0ee;color:#a32b20}
.reportGrid{grid-template-columns:repeat(3,minmax(0,1fr))}.reportCard{min-height:170px;display:flex;flex-direction:column;justify-content:space-between}.reportCard .big{font-size:26px;font-weight:900;margin-top:8px}.reportActions{display:flex;gap:6px;justify-content:flex-end}.metricList{display:flex;flex-direction:column;gap:8px}.metric{display:flex;justify-content:space-between;gap:10px;padding-bottom:8px;border-bottom:1px dashed #dfe8e3;font-size:12px}.metric:last-child{border-bottom:0}.metric strong{font-size:12px}.previewHead{display:flex;justify-content:space-between;align-items:center;gap:10px;padding-bottom:12px;border-bottom:1px solid var(--line)}.reportTabs{display:flex;gap:7px;overflow:auto;margin:14px 0}.reportTab{border:1px solid var(--line);background:#fff;padding:9px 12px;border-radius:999px;white-space:nowrap;font-size:11px;font-weight:800;color:#53615b}.reportTab.active{background:#0c4f3b;color:#fff;border-color:#0c4f3b}.auditItem{display:flex;gap:12px;padding:13px 0;border-bottom:1px solid #edf1ee}.auditItem:last-child{border-bottom:0}.sev{width:9px;height:9px;border-radius:50%;margin-top:5px;background:#89bfa8}.sev.warn{background:#f59e0b}.sev.error{background:#ef4444}.auditTitle{font-size:12px;font-weight:900}.auditMsg{font-size:11px;color:var(--muted);line-height:1.45;margin-top:3px}
.modal{position:fixed;inset:0;background:rgba(3,12,9,.58);backdrop-filter:blur(12px);display:none;align-items:center;justify-content:center;padding:15px;z-index:100}.modal.open{display:flex}.modalBox{background:#fff;width:min(100%,1100px);max-height:92vh;overflow:auto;border-radius:24px;box-shadow:0 30px 100px rgba(0,0,0,.35)}.modalHead{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px;position:sticky;top:0;background:#fff;z-index:2}.modalBody{padding:18px}.drawer{position:fixed;inset:0;display:none;z-index:90;background:rgba(0,0,0,.25)}.drawer.open{display:block}.drawerPanel{margin-left:auto;width:min(640px,100%);height:100%;background:#fff;box-shadow:-20px 0 60px rgba(0,0,0,.22);overflow:auto}.drawerHead{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:#fff;z-index:2}
.toast{position:fixed;right:16px;bottom:96px;background:#0b2d22;color:#fff;border:1px solid rgba(255,255,255,.08);box-shadow:0 20px 40px rgba(0,0,0,.22);padding:12px 14px;border-radius:13px;display:none;z-index:120;font-size:12px}.toast.show{display:block}.mobileNav{display:none;position:fixed;left:10px;right:10px;bottom:10px;z-index:60;background:rgba(8,30,23,.94);backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.08);border-radius:20px;padding:8px;box-shadow:0 20px 50px rgba(0,0,0,.2)}.mobileNav button{flex:1;border:0;background:transparent;color:#bad0c6;border-radius:14px;padding:9px 6px;font-size:10px;font-weight:800}.mobileNav button.active{background:#d8f573;color:#12321f}.mobileNav .mi{font-size:16px;display:block;margin-bottom:2px}
@media(max-width:1180px){.kpiGrid{grid-template-columns:repeat(3,minmax(0,1fr))}.quickGrid{grid-template-columns:repeat(2,minmax(0,1fr))}.reportGrid{grid-template-columns:repeat(2,minmax(0,1fr))}.formGrid{grid-template-columns:repeat(4,minmax(0,1fr))}.span4{grid-column:span 4}.span6{grid-column:1/-1}}
@media(max-width:820px){body{padding-bottom:86px}.layout{display:block;padding:12px}.sidebar{display:none}.mobileNav{display:flex}.topbarInner{padding:12px 14px}.brandText span{display:none}.topbarSpacer{min-width:4px}.sync{font-size:10px}.hero{align-items:flex-start;flex-direction:column}.heroActions{width:100%}.heroActions .btn{flex:1}.kpiGrid{grid-template-columns:repeat(2,minmax(0,1fr))}.cardGrid,.reportGrid{grid-template-columns:1fr}.formGrid{grid-template-columns:repeat(2,minmax(0,1fr))}.span2,.span3,.span4,.span6{grid-column:1/-1}.quickGrid{grid-template-columns:repeat(2,minmax(0,1fr))}.card{border-radius:17px;padding:14px}}
@media(max-width:520px){.kpiGrid{grid-template-columns:1fr 1fr}.quickGrid{grid-template-columns:1fr 1fr}.hero h1{font-size:25px}.btn{min-height:40px;padding:9px 11px}.dataHeader{align-items:flex-start}.dataTools{flex-wrap:wrap}.modal{padding:0}.modalBox{max-height:100vh;border-radius:0}.modalHead{padding-top:18px}.drawerPanel{width:100%}}
@media print{.topbar,.sidebar,.mobileNav,.heroActions,.reportTabs,.dataTools,.btn{display:none!important}.app{background:white}.layout{display:block;padding:0}.card{box-shadow:none;border:1px solid #ddd}.page{display:none!important}.page.printing{display:block!important}body{background:white;padding:0}}
</style>
</head>
<body>
<div class="app">
<header class="topbar"><div class="topbarInner"><div class="brand"><div class="brandMark">V</div><div class="brandText"><strong>Farm & Trading Financial Manager</strong><span>Inventory • Cash Flow • Sales • Reports</span></div></div><div class="topbarSpacer"></div><div id="sync" class="sync"><span class="dot warn"></span> Connecting…</div></div></header>
<div class="layout">
<aside class="sidebar" id="sidebar"></aside>
<main class="main">
<section id="page-dashboard" class="page active"></section>
<section id="page-cash" class="page"></section>
<section id="page-inventory" class="page"></section>
<section id="page-sales" class="page"></section>
<section id="page-purchases" class="page"></section>
<section id="page-reports" class="page"></section>
<section id="page-audit" class="page"></section>
</main>
</div>
<nav class="mobileNav" id="mobileNav"></nav>
</div>
<div id="modal" class="modal"></div>
<div id="drawer" class="drawer" onclick="if(event.target===this)closeDrawer()"><div class="drawerPanel"><div id="drawerContent"></div></div></div>
<div id="toast" class="toast"></div>
<script>
const API=(window.VEGE_API_BASE||'https://vege.mdmsportal.uk').replace(/\/$/,'');
const apiPath=p=>p.startsWith('/api/')?p:'/api'+p;
const $=id=>document.getElementById(id);const today=new Date().toISOString().slice(0,10);const money=n=>'₱'+Number(n||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const navs=[['dashboard','⌂','Dashboard'],['cash','₱','Cash'],['inventory','▦','Inventory'],['sales','↗','Sales'],['purchases','↙','Purchases'],['reports','▤','Reports'],['audit','✓','Audit']];
let state={page:'dashboard',products:[],cash:[],sales:[],purchases:[],collections:[],activity:[],summary:null,reports:null,audit:null};

function icon(name){return ({print:'🖨',download:'⇩',plus:'＋',close:'×',refresh:'↻',arrow:'→',search:'⌕',calendar:'◷',filter:'≡',audit:'✓'})[name]||''}
function toast(msg){const el=$('toast');el.textContent=msg;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2600)}
async function api(path,opt={}){const res=await fetch(API+apiPath(path),{...opt,headers:{Accept:'application/json','X-VEGE-Client':'github-pwa-v3',...(opt.headers||{})}});if(!res.ok){const text=await res.text();let msg=text;try{msg=JSON.parse(text).error||text}catch{}throw Error(msg||`HTTP ${res.status}`)}const ct=res.headers.get('content-type')||'';return ct.includes('json')?res.json():res.text()}
function setNav(){const html=navs.map(([id,ic,label])=>`<button class="navItem ${state.page===id?'active':''}" onclick="showPage('${id}')"><span class="navIcon">${ic}</span><span>${label}</span></button>`).join('');$('sidebar').innerHTML=html+`<div class="sidebarFoot"><b>Realtime</b><br>Changes are synced across open devices through the backend event stream.<br><br><b>Accounting mode</b><br>Sales and purchases create linked inventory/cash effects automatically.</div>`;$('mobileNav').innerHTML=navs.slice(0,5).map(([id,ic,label])=>`<button class="${state.page===id?'active':''}" onclick="showPage('${id}')"><span class="mi">${ic}</span>${label}</button>`).join('')}
function showPage(id){state.page=id;document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));$('page-'+id).classList.add('active');setNav();if(id==='reports')renderReports();if(id==='audit')renderAudit()}
function cardKpi(label,value,foot,cls='neutral'){return `<div class="card kpiCard"><div class="kpiLabel">${label}</div><div class="kpiValue ${cls}">${value}</div><div class="kpiFoot">${foot||''}</div></div>`}
function toolbar(title,count,downloadFn,printFn){return `<div class="dataHeader"><div><strong>${title}</strong><div style="font-size:11px;color:var(--muted)">${count} record${count===1?'':'s'}</div></div><div class="dataTools"><button class="btn secondary icon" title="Print" onclick="${printFn}">${icon('print')}</button><button class="btn secondary icon" title="Download" onclick="${downloadFn}">${icon('download')}</button></div></div>`}
function csvDownload(name,rows){if(!rows.length){toast('Nothing to download');return}const headers=Object.keys(rows[0]);const csv=[headers.join(','),...rows.map(r=>headers.map(h=>'"'+String(r[h]??'').replace(/"/g,'""')+'"').join(','))].join('\n');const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();URL.revokeObjectURL(a.href)}
function printHtml(title,html){const w=window.open('','_blank','width=1100,height=800');if(!w){toast('Allow pop-ups to print');return}w.document.write(`<!doctype html><html><head><title>${esc(title)}</title><style>body{font-family:Arial,sans-serif;padding:28px;color:#111}h1{font-size:22px}table{width:100%;border-collapse:collapse;margin-top:18px}th,td{border-bottom:1px solid #ddd;padding:8px;font-size:12px;text-align:left}th{background:#f3f5f4;text-transform:uppercase;font-size:10px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.card{border:1px solid #ddd;border-radius:12px;padding:12px}.muted{color:#666}</style></head><body><h1>${esc(title)}</h1>${html}</body></html>`);w.document.close();w.focus();setTimeout(()=>w.print(),300)}

function renderDashboard(){const s=state.summary||{};const a=state.audit||{issues:[]};$('page-dashboard').innerHTML=`<div class="hero"><div><div class="eyebrow">Executive overview</div><h1>Good day. Here is your business pulse.</h1><p>Premium operational dashboard with financial integrity checks built in.</p></div><div class="heroActions"><button class="btn secondary" onclick="refreshAll()">${icon('refresh')} Refresh</button><button class="btn primary" onclick="showPage('sales')">${icon('plus')} New Sale</button></div></div>
<div class="grid kpiGrid">${cardKpi('Cash on Hand',money(s.cash),'Actual cash movement',s.cash>=0?'positive':'negative')}${cardKpi('Revenue',money(s.revenue),'Recognized revenue',s.revenue>=0?'positive':'neutral')}${cardKpi('Net Income',money(s.netIncome),'Profit after COGS & expenses',s.netIncome>=0?'positive':'negative')}${cardKpi('Inventory',money(s.inventory),'Current stock value',s.inventory>0?'positive':'neutral')}${cardKpi('Audit Alerts',a.issues?.length||0,'Items requiring review',(a.issues?.length||0)?'negative':'positive')}</div>
<div class="grid quickGrid section">${['Cash Entry|Record non-sales cash movements|cash','Inventory|Manage products and stock|inventory','Sales|Create linked sales + COGS|sales','Purchases|Record stock purchases|purchases'].map(x=>{const [t,d,p]=x.split('|');return `<div class="card clickable quick" onclick="showPage('${p}')"><strong>${t}</strong><span>${d}</span></div>`}).join('')}</div>
<div class="grid cardGrid section"><div class="card clickable" onclick="showPage('reports')"><div class="panelTitle"><h3>Financial Snapshot</h3><span>Open reports →</span></div><div class="metricList"><div class="metric"><span>Net cash movement</span><strong>${money(state.reports?.cash_flow?.['Net Cash Flow'])}</strong></div><div class="metric"><span>Gross profit</span><strong>${money(state.reports?.income_statement?.['Gross Profit'])}</strong></div><div class="metric"><span>Receivables</span><strong>${money(state.reports?.balance_sheet?.['Accounts Receivable'])}</strong></div><div class="metric"><span>Loans</span><strong>${money(state.reports?.balance_sheet?.['Loans (net)'])}</strong></div></div></div><div class="card"><div class="panelTitle"><h3>Recent Activity</h3><span>${state.activity.length} loaded</span></div>${renderActivityList(state.activity.slice(0,7))}</div><div class="card clickable" onclick="showPage('audit')"><div class="panelTitle"><h3>Accounting Integrity</h3><span>Open audit →</span></div>${renderAuditMini(a.issues||[])}</div></div>`}
function renderActivityList(rows){if(!rows.length)return '<div class="empty">No transactions yet.</div>';return `<div class="list">${rows.map(r=>`<div class="listItem"><div class="avatar">${r.type==='sale'?'S':r.type==='purchase'?'P':r.type==='collection'?'C':r.direction==='in'?'↓':'↑'}</div><div class="liMain"><div class="liTitle">${esc(r.label||r.category||r.type)}</div><div class="liMeta">${esc(r.date)}${r.detail?' • '+esc(r.detail):''}</div></div><div class="liAmount ${r.direction==='out'?'negative':'positive'}">${money(r.amount)}</div></div>`).join('')}</div>`}
function renderAuditMini(issues){if(!issues.length)return `<div class="notice">✓ No audit exceptions detected for the selected period.</div>`;return `<div class="list">${issues.slice(0,4).map(i=>`<div class="listItem"><div class="avatar">${i.severity==='error'?'!':'•'}</div><div class="liMain"><div class="liTitle">${esc(i.title)}</div><div class="liMeta">${esc(i.message)}</div></div><div class="liAmount">${money(i.amount)}</div></div>`).join('')}</div>`}

function renderCash(){
 const rows=state.cash;
 const tableRows=rows.map(r=>'<tr><td>'+esc(r.date)+'</td><td><span class="badge '+(r.direction==='in'?'':'warn')+'">'+(r.direction==='in'?'Cash In':'Cash Out')+'</span></td><td>'+esc(r.category)+'</td><td>'+esc(r.description)+'</td><td>'+esc(r.source||'manual')+'</td><td class="num">'+money(r.amount)+'</td></tr>').join('');
 $('page-cash').innerHTML='<div class="hero"><div><div class="eyebrow">Cash management</div><h1>Cash center</h1><p>Record genuine cash movements. Use Sales and Collections for customer-related cash.</p></div></div>'+
 '<div class="notice warn">Cash Sale and Customer Collection are now handled through their own workflows so reports can link them correctly to revenue and receivables.</div>'+

function reportPeriodFields(){return `<div class="card"><div class="formGrid"><div class="field"><label>Period</label><select id="period" onchange="setReportPeriod()"><option value="day">Day</option><option value="week">Week</option><option value="month" selected>Month</option><option value="year">Year</option><option value="custom">Custom</option></select></div><div class="field"><label>From</label><input id="fromDate" type="date" value="${today.slice(0,8)+'01'}"></div><div class="field"><label>To</label><input id="toDate" type="date" value="${today}"></div><div class="formActions"><button class="btn primary" onclick="loadReports()">Apply</button></div><div class="formActions"><button class="btn secondary" onclick="downloadFullReport()">${icon('download')} Excel</button></div></div></div>`}
function setReportPeriod(){const p=$('period').value;const f=new Date(($('fromDate').value||today)+'T00:00:00');if(p==='day')$('toDate').value=$('fromDate').value;else if(p==='week'){const d=new Date(f);d.setDate(d.getDate()+6);$('toDate').value=d.toISOString().slice(0,10)}else if(p==='month')$('toDate').value=new Date(f.getFullYear(),f.getMonth()+1,0).toISOString().slice(0,10);else if(p==='year')$('toDate').value=new Date(f.getFullYear(),11,31).toISOString().slice(0,10)}

function reportCard(title,subtitle,items,accent='neutral'){
 const metricHtml=items.slice(0,-1).map(pair=>'<div class="metric"><span>'+esc(pair[0])+'</span><strong>'+money(pair[1])+'</strong></div>').join('');
 const last=items[items.length-1];
 return '<div class="card reportCard clickable" onclick=\'openReport("'+esc(title).replace(/"/g,'&quot;')+'",'+JSON.stringify(items).replace(/</g,'&lt;')+')\'><div><div class="panelTitle"><h3>'+esc(title)+'</h3><span>'+esc(subtitle)+'</span></div>'+metricHtml+'</div><div><div class="eyebrow">'+esc(last[0])+'</div><div class="big '+(last[1]>=0?'positive':'negative')+'">'+money(last[1])+'</div><div class="reportActions"><button class="btn secondary icon" title="Print" onclick=\'event.stopPropagation();openReport("'+esc(title).replace(/"/g,'&quot;')+'",'+JSON.stringify(items).replace(/</g,'&lt;')+')\'>'+icon('print')+'</button><button class="btn secondary icon" title="Download" onclick=\'event.stopPropagation();downloadReportCard("'+esc(title).replace(/"/g,'&quot;')+'",'+JSON.stringify(items).replace(/</g,'&lt;')+')\'>'+icon('download')+'</button></div></div></div>';
}

}
function downloadReportCard(title,items){downloadReportObject(title,Object.fromEntries(items))}
function downloadReportObject(title,obj){const rows=Object.entries(obj).map(([k,v])=>({line_item:k,amount:v}));csvDownload(title.toLowerCase().replace(/\s+/g,'_')+'.csv',rows)}
function printReportObject(title,obj){printHtml(title,reportTable(title,obj))}
function downloadReportInventory(){csvDownload('vege_inventory_report.csv',(state.reports?.inventoryRows||[]).map(x=>({product:x.name,unit:x.unit,unit_cost:x.unit_cost,quantity:x.qty,value:Number(x.qty)*Number(x.unit_cost)})))}
function printReportInventory(){printHtml('Inventory Report',`<table><tr><th>Product</th><th>Unit</th><th>Cost</th><th>Qty</th><th>Value</th></tr>${(state.reports?.inventoryRows||[]).map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.unit)}</td><td>${money(x.unit_cost)}</td><td>${x.qty}</td><td>${money(Number(x.qty)*Number(x.unit_cost))}</td></tr>`).join('')}</table>`)}
function downloadFullReport(){location=`${API}${apiPath('/reports/excel')}?from=${encodeURIComponent($('fromDate')?.value||today.slice(0,8)+'01')}&to=${encodeURIComponent($('toDate')?.value||today)}`}

function renderAudit(){const a=state.audit||{issues:[],counts:{}};$('page-audit').innerHTML=`<div class="hero"><div><div class="eyebrow">Financial integrity</div><h1>Audit & controls</h1><p>The app now explains why a number may look unusual instead of hiding the discrepancy.</p></div><div class="heroActions"><button class="btn secondary" onclick="refreshAll()">${icon('refresh')} Re-run audit</button></div></div><div class="grid cardGrid"><div class="card"><div class="panelTitle"><h3>Current control status</h3><span>${a.issues.length} issue(s)</span></div>${renderAuditMini(a.issues)}</div><div class="card"><div class="panelTitle"><h3>Detected patterns</h3></div><div class="metricList"><div class="metric"><span>Legacy cash sales</span><strong>${a.counts?.legacySales||0}</strong></div><div class="metric"><span>Legacy customer collections</span><strong>${a.counts?.legacyCollections||0}</strong></div><div class="metric"><span>Negative stock items</span><strong>${a.counts?.negativeStock||0}</strong></div><div class="metric"><span>Zero-COGS sales</span><strong>${a.counts?.noCostSales||0}</strong></div></div></div><div class="card"><div class="panelTitle"><h3>What changed</h3></div><div class="notice">Sales now create the revenue and inventory effects together. Cash and Collections have distinct workflows. Reports also expose legacy/manual entries instead of silently mixing them.</div></div></div>`}

function openProductDetail(id){const row=state.products.find(x=>x.id==id);if(row)openDataset('Product • '+row.name,row);}
function openDataset(title,row){
 openDrawer();
 const rows=Object.entries(row||{}).map(pair=>'<div class="metric"><span>'+esc(pair[0])+'</span><strong>'+(typeof pair[1]==='number'?money(pair[1]):esc(pair[1]))+'</strong></div>').join('');
 $('drawerContent').innerHTML='<div class="drawerHead"><div><b>'+esc(title)+'</b><div style="font-size:11px;color:var(--muted)">Dataset detail</div></div><button class="btn secondary icon" onclick="closeDrawer()">'+icon('close')+'</button></div><div class="modalBody"><div class="metricList">'+rows+'</div><div class="heroActions" style="margin-top:16px"><button class="btn secondary" onclick=\'printDataset("'+esc(title).replace(/"/g,'&quot;')+'",'+JSON.stringify(row).replace(/</g,'&lt;')+')\'>'+icon('print')+' Print</button><button class="btn primary" onclick=\'downloadDataset("'+esc(title).replace(/"/g,'&quot;')+'",'+JSON.stringify(row).replace(/</g,'&lt;')+')\'>'+icon('download')+' Download</button></div></div>';
}
function printDataset(title,row){printHtml(title,`<table>${Object.entries(row).map(([k,v])=>`<tr><th>${esc(k)}</th><td>${typeof v==='number'?money(v):esc(v)}</td></tr>`).join('')}</table>`)}
function downloadDataset(title,row){csvDownload(title.toLowerCase().replace(/\s+/g,'_')+'.csv',[row])}
function openDrawer(){$('drawer').classList.add('open')}function closeDrawer(){$('drawer').classList.remove('open')}

async function refreshAll(){try{const t=today;const [products,cash,sales,purchases,collections,activity,summary,reports,audit]=await Promise.all([api('/products'),api('/cash'),api('/sales'),api('/purchases'),api('/collections'),api('/activity?limit=80'),api('/summary?to='+t),api(`/reports?from=${t.slice(0,8)}01&to=${t}`),api('/audit')]);state={...state,products,cash,sales,purchases,collections,activity,summary,reports,audit};renderDashboard();renderCash();renderInventory();renderSales();renderPurchases();renderReports();renderAudit();$('sync').innerHTML=`<span class="dot"></span> Realtime • ${new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}`;setNav()}catch(e){$('sync').innerHTML=`<span class="dot bad"></span> API error`;console.error(e);toast(e.message)}}
function connectRealtime(){if(!('EventSource' in window))return;const es=new EventSource(API+apiPath('/events'));es.addEventListener('ready',()=>{$('sync').innerHTML='<span class="dot"></span> Realtime connected'});es.addEventListener('data-change',()=>refreshAll());es.onerror=()=>{$('sync').innerHTML='<span class="dot warn"></span> Reconnecting…'};window.addEventListener('beforeunload',()=>es.close())}

setNav();showPage('dashboard');refreshAll().then(connectRealtime);if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(console.error));
</script>
</body>
</html>
